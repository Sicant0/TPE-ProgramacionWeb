services:
  db:
    image: postgres:16
    container_name: proyecto_web
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${PORT_OUT}:${PORT_IN}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d
    networks:
      - red-app
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${DB_USER}", "-d", "${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT_IN=${PORT_IN}
      - PORT_OUT=${PORT_OUT}

volumes:
  pgdata:

networks:
  red-app:
    driver: bridge
    name: red-app